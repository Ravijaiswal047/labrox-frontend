     <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
      (function () {
        try {
          var SECRET_KEY = "your-secret-key";
          var encryptedData = localStorage.getItem("userData");
          if (encryptedData) {
            var bytes = CryptoJS.AES.decrypt(encryptedData, SECRET_KEY);
            var decryptedData = bytes.toString(CryptoJS.enc.Utf8);
            if (decryptedData) {
              var userData = JSON.parse(decryptedData);
              var fontSize = Number(userData?.applicationFont || 13);
              document.documentElement.style.setProperty(
                "--app-font-size",
                fontSize + "px"
              );
              var height = Math.max(28, fontSize * 2);
              document.documentElement.style.setProperty(
                "--control-height",
                height + "px"
              );
            }
          }
        } catch (e) {}
      })();
    </script>
